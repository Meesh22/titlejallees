<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" fill="none">
  <defs>
    <linearGradient id="m1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2B"/>
      <stop offset="100%" stop-color="#102118"/>
    </linearGradient>
    <pattern id="m1pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#C59B63" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#m1bg)"/>
  <rect width="640" height="360" fill="url(#m1pattern)"/>

  <!-- Cultural Arch Border -->
  <rect x="24" y="24" width="592" height="312" rx="12" stroke="#C59B63" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Meeting Number Tag -->
  <g transform="translate(48, 48)">
    <rect width="110" height="28" rx="14" fill="#C59B63" fill-opacity="0.2"/>
    <text x="55" y="19" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="12" font-weight="700" fill="#E6DEC9">اللقاء الأول [تجريبي]</text>
  </g>

  <!-- Large Topic Title in Arabic -->
  <text x="590" y="145" text-anchor="end" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="30" font-weight="800" fill="#FAF6EE">
    قراءات في تاريخ نجد وحضارتها
  </text>
  <text x="590" y="185" text-anchor="end" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="17" font-weight="500" fill="#D3C9B5">
    استضافة حوارية حول أبرز المخطوطات والتدوينات التاريخية
  </text>

  <!-- Guest & Details Ribbon -->
  <g transform="translate(48, 260)">
    <rect width="544" height="48" rx="8" fill="#14281E" stroke="#2D553F" stroke-width="1"/>
    <!-- Calendar icon and date -->
    <text x="30" y="30" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="14" fill="#C59B63">١٤٤٥ هـ • تسجيل وثائقي</text>
    <!-- Guest -->
    <text x="520" y="30" text-anchor="end" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="15" font-weight="700" fill="#FAF6EE">الضيف: باحث ومؤرخ مهتم بتاريخ القصيم</text>
  </g>

  <!-- Center Play Badge overlay indication -->
  <circle cx="320" cy="180" r="32" fill="#C59B63" fill-opacity="0.9"/>
  <polygon points="314,166 332,180 314,194" fill="#1E3A2B"/>
</svg>